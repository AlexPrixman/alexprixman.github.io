name: Fix demo PR dependency audit

on:
  push:
    branches: [feat/negotium-interactive-portfolio-demo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/negotium-interactive-portfolio-demo
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply safe dependency audit fixes
        run: |
          npm ci
          npm audit fix --audit-level=high
      - name: Commit only dependency files when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: fix vulnerable portfolio development dependencies"
            git push origin HEAD:feat/negotium-interactive-portfolio-demo
          fi
